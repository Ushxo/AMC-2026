[project]
name = "data"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "ortools>=9.15.6755",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "shapely>=2.2.0",
    "supabase>=2.34.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
